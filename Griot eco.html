<title>Le Griot Éco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: a serious weekly business paper, calm and trustworthy
   IDEA: a printed African business weekly in your pocket
   PICTURE: the front page itself — masthead, big headline, the number
   COLOUR and TYPE: newsprint, ink, latérite red stamp; Gelasio + Fira Sans (chosen by the owner)
   LAYOUT: one phone column, rules between sections, four tabs */
:root{color-scheme:light dark;--bg:light-dark(#F3EEE4,#15130F);--ink:light-dark(#1C1A17,#EDE6DA);--mute:light-dark(#6B6358,#A39886);--line:light-dark(#CFC6B6,#3A342C);--red:light-dark(#A3402A,#D9603F);--green:light-dark(#2F5D3A,#6FAF7E);--ph:light-dark(#BDB4A5,#3A342C);--card:light-dark(#FBF8F2,#1E1B16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Fira Sans',system-ui,sans-serif;overflow-x:clip}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 20px 96px}
a{color:inherit}
.serif{font-family:Gelasio,Georgia,serif}
.mast{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;border-bottom:3px double var(--ink)}
.mast h1{font:700 26px/1.1 Gelasio,Georgia,serif;margin:0;letter-spacing:-.3px}.mast h1 i{font-weight:400}
.dateline{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:7px 0;border-bottom:1px solid var(--ink)}
.kick{font-size:13px;font-weight:600;color:var(--red);margin:18px 0 4px}
h2.head{font:700 clamp(28px,7.5vw,36px)/1.08 Gelasio,Georgia,serif;letter-spacing:-.5px;margin:4px 0 8px;text-wrap:balance}
h3{font:700 20px/1.2 Gelasio,Georgia,serif;margin:0 0 6px}
.dek{font:italic 17px/1.45 Gelasio,Georgia,serif;margin:0}
.meta{font-size:13px;color:var(--mute)}
.rule{border:0;border-top:1px solid var(--ink);margin:20px 0 4px}
.body p{font:17px/1.6 Gelasio,Georgia,serif;margin:0 0 14px}
.drop::first-letter{float:left;font:700 54px/.85 Gelasio,serif;padding:5px 6px 0 0;color:var(--red)}
.pull{border-left:3px solid var(--red);padding:2px 0 2px 14px;margin:16px 0;font:italic 19px/1.4 Gelasio,serif}
.ph{background:var(--ph);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);font-size:13px;text-align:center;padding:16px;border:0;width:100%;font-family:inherit;cursor:pointer}
.ph.big{height:190px;margin:14px 0 0}
.cap{font-size:13px;color:var(--mute);margin:6px 0 0}.cap b{color:var(--ink)}
.fig{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.fig .n{flex:none;font:700 clamp(48px,14vw,60px)/.9 Gelasio,serif;letter-spacing:-2px;white-space:nowrap}
.row{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .co{font:700 17px Gelasio,serif}.row .amt{margin-left:auto;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.pouls{list-style:none;padding:0;margin:0}ul.pouls li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}ul.pouls li:first-child{border:0}
.btn{display:block;width:100%;min-height:46px;font:600 15px 'Fira Sans',sans-serif;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;margin-top:12px}
.btn.solid{background:var(--red);border-color:var(--red);color:#F3EEE4}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.sw:focus-visible,.chip:focus-visible,.ph:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.card{border:1px solid var(--ink);padding:14px;margin-top:12px;cursor:pointer;background:var(--card)}
.audio{display:flex;align-items:center;gap:12px;border:1px solid var(--ink);padding:10px 12px;margin:14px 0}
.play{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.video{position:relative;height:200px;background:#2b2722;display:flex;align-items:center;justify-content:center;color:#F3EEE4;margin:8px -20px 0}
.vbadge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.7);font-size:12px;padding:3px 8px}
.opp{padding:12px 0;border-top:1px solid var(--line)}.opp:first-of-type{border-top:1px solid var(--ink)}
.dl{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--red);color:var(--red);padding:2px 7px;margin-top:6px}
.src{font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--ink);margin:10px 0}
.seg button{flex:1;min-height:40px;background:transparent;border:0;border-right:1px solid var(--ink);color:var(--ink);font:500 14px 'Fira Sans',sans-serif;cursor:pointer}
.seg button:last-child{border:0}.seg button.on{background:var(--ink);color:var(--bg)}
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.set .l{font-weight:500}.set .s{font-size:13px;color:var(--mute)}
.sw{margin-left:auto;width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--ink)}.sw[aria-checked=true]::after{left:23px;background:var(--bg)}
.sec{font-size:13px;font-weight:600;margin:22px 0 6px}
.chip{display:inline-block;font:14px 'Fira Sans',sans-serif;padding:8px 12px;border:1px solid var(--ink);margin:0 6px 8px 0;background:transparent;color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
select{font:16px 'Fira Sans',sans-serif;padding:6px;background:var(--bg);color:var(--ink);border:1px solid var(--ink);margin-left:auto}
.alert{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.alert .w{font-size:12px;color:var(--mute);width:50px;flex-shrink:0;padding-top:3px}
.alert .t{font:700 16px/1.3 Gelasio,serif}.alert.new .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin:0 7px 2px 0}
.lock{margin-top:8px}.lock .blur{filter:blur(4px);opacity:.5;user-select:none;margin:0}.lock .blur p{margin:6px 0}
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ink);display:flex;justify-content:center;padding:6px 0 max(10px,env(safe-area-inset-bottom))}
.tabs div{display:flex;max-width:520px;width:100%}
.tab{flex:1;background:transparent;border:0;color:var(--mute);font:12px 'Fira Sans',sans-serif;cursor:pointer;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{color:var(--ink);font-weight:600}
.back{background:none;border:0;color:var(--ink);font:15px 'Fira Sans',sans-serif;padding:14px 0 12px;cursor:pointer;min-height:44px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--mute);margin-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.onb{min-height:100vh;display:flex;flex-direction:column;padding:28px 0 32px}
.steps{display:flex;gap:6px;margin-bottom:26px}.steps i{flex:1;height:3px;background:var(--line)}.steps i.on{background:var(--red)}
.field{display:block;margin-top:16px}.field span{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input{width:100%;font:16px 'Fira Sans',sans-serif;padding:12px;border:1px solid var(--ink);background:var(--card);color:var(--ink)}
.field input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:15px 'Fira Sans',sans-serif;cursor:pointer;min-height:44px;margin-top:8px}
.hero{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:22px 0;margin:22px 0}
.who{display:flex;align-items:center;gap:12px;padding:12px 0}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 18px Gelasio,serif;flex-shrink:0}
.why{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.why:first-of-type{border-top:1px solid var(--ink)}
.why .k{font:700 22px/1 Gelasio,serif;color:var(--red);width:26px;flex-shrink:0}
.why b{font:700 17px/1.3 Gelasio,serif;display:block;margin-bottom:2px}.why p{margin:0;font-size:15px;color:var(--mute)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.big2{font:700 clamp(36px,10vw,46px)/1 Gelasio,serif;letter-spacing:-1px;white-space:nowrap}
.duo .big2{font-size:clamp(24px,7vw,34px)}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
.bar{height:10px;background:var(--ink);margin:8px 0 4px}.bar.r{background:var(--red)}
ol.steps2{padding-left:20px;margin:6px 0}ol.steps2 li,ul.risks li{margin:8px 0;font-size:15px}ul.risks{padding-left:18px;margin:6px 0}
.disc{border:1px solid var(--ink);padding:10px 12px;font-size:13px;margin:14px 0}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:12px 14px;margin-top:8px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:16px/1.35 'Fira Sans',sans-serif;cursor:pointer}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.opt.ok{border:2px solid var(--green);background:color-mix(in srgb,var(--green) 14%,var(--card))}
.opt.no{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}
.prog{height:8px;background:var(--line);margin:10px 0 6px}.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.les{display:flex;gap:14px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-height:60px}
.les .k{font:700 22px/1 Gelasio,serif;color:var(--red);width:26px;flex:none}
.les .st{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap;padding-left:8px}.les .st.ok{color:var(--green);font-weight:600}
.ex{background:var(--card);border:1px solid var(--line);padding:12px 14px;margin:14px 0;font-size:15px}
.fb{margin-top:14px;font-size:15px}.fb b{display:block;font:700 18px Gelasio,serif;margin-bottom:2px}
.opt:focus-visible,.les:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>

const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

function chart(){const W=320,H=150,p=28,min=320,max=570,n=BRVM.length;
 const x=i=>p+i*(W-p-8)/(n-1),y=v=>H-22-(v-min)/(max-min)*(H-36);
 const pts=BRVM.map((d,i)=>`${x(i).toFixed(1)},${y(d[1]).toFixed(1)}`).join(" ");
 const grid=[350,450,550].map(v=>`<line x1="${p}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mute)">${v}</text>`).join("");
 const l=BRVM.length-1;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="BRVM Composite">${grid}
 <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5"/>
 <circle cx="${x(0)}" cy="${y(BRVM[0][1])}" r="3.5" fill="var(--ink)"/><circle cx="${x(6)}" cy="${y(BRVM[6][1])}" r="3.5" fill="var(--red)"/><circle cx="${x(l)}" cy="${y(BRVM[l][1])}" r="3.5" fill="var(--ink)"/>
 <text x="${x(0)}" y="${H-6}" font-size="10" fill="var(--mute)">${S.lang=="fr"?"fin 2025":"end 2025"}</text><text x="${x(6)}" y="${y(BRVM[6][1])-8}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">548,6</text><text x="${x(l)}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--mute)">${S.lang=="fr"?"fin oct.":"end Oct"}</text></svg>`}

const LES=[
{id:"action",fr:{t:"L'action",s:"Devenir copropriétaire d'une entreprise",p:["Une action est une petite part d'une entreprise. En l'achetant, vous devenez l'un de ses propriétaires, même pour un tout petit morceau.","Elle peut vous rapporter de deux façons : le dividende, une part des bénéfices que l'entreprise verse chaque année, et la plus-value, si vous revendez l'action plus cher que vous l'avez achetée.","Mais rien n'est garanti : si l'entreprise va mal, le prix de l'action peut baisser et le dividende disparaître."],ex:"Sonatel, l'opérateur télécom du Sénégal, est cotée à la BRVM, la Bourse régionale d'Abidjan. N'importe quel épargnant peut en acheter des actions via un intermédiaire agréé.",q:[["Vous achetez une action de Sonatel. Que devenez-vous ?",["Un client prioritaire de Sonatel","Copropriétaire d'une petite part de l'entreprise","Un prêteur de Sonatel"],1,"Une action est une part de propriété. Un prêteur, lui, achète une obligation (prochaine leçon)."],["Comment s'appelle la part des bénéfices versée aux actionnaires ?",["Le dividende","L'intérêt","La commission"],0,"Le dividende est la part des bénéfices distribuée aux actionnaires. Il n'est jamais garanti."]]},
en:{t:"Shares",s:"Owning a piece of a company",p:["A share is a small slice of a company. When you buy one, you become one of its owners, even of a tiny piece.","It can pay you in two ways: the dividend, a share of the profits the company pays out each year, and capital gains, if you sell the share for more than you paid.","But nothing is guaranteed: if the company struggles, the share price can fall and the dividend can disappear."],ex:"Sonatel, Senegal's telecoms operator, is listed on the BRVM, the regional stock exchange in Abidjan. Any saver can buy its shares through a licensed broker.",q:[["You buy a Sonatel share. What do you become?",["A priority Sonatel customer","Co-owner of a small piece of the company","A lender to Sonatel"],1,"A share is a piece of ownership. A lender buys a bond instead (next lesson)."],["What is the share of profits paid to shareholders called?",["The dividend","Interest","A commission"],0,"The dividend is the share of profits paid out to shareholders. It is never guaranteed."]]}},
{id:"obligation",fr:{t:"L'obligation",s:"Prêter de l'argent contre des intérêts",p:["Quand un État ou une entreprise a besoin d'argent, il peut l'emprunter auprès du public en émettant des obligations.","Acheter une obligation, c'est prêter : vous recevez des intérêts réguliers, puis votre argent vous est rendu à une date fixée d'avance, l'échéance.","C'est en général moins risqué qu'une action, mais cela rapporte souvent moins. Le risque principal : que l'emprunteur ne puisse pas rembourser."],ex:"Les États d'Afrique de l'Ouest, comme la Côte d'Ivoire ou le Sénégal, empruntent régulièrement sur le marché régional en émettant des obligations. Une partie est cotée à la BRVM.",q:[["Vous achetez une obligation de l'État. Vous êtes…",["Propriétaire d'une partie du pays","Prêteur à l'État","Actionnaire de la banque centrale"],1,"Une obligation est un prêt : l'État vous verse des intérêts et vous rembourse à l'échéance."],["Quel est le principal risque d'une obligation ?",["Que l'emprunteur ne rembourse pas","Que l'action monte trop vite","Qu'il n'y ait pas de dividende"],0,"Le risque central d'un prêt, c'est le défaut : l'emprunteur n'arrive plus à payer."]]},
en:{t:"Bonds",s:"Lending money for interest",p:["When a government or a company needs money, it can borrow from the public by issuing bonds.","Buying a bond means lending: you receive regular interest, then your money is paid back on a date set in advance, the maturity.","It is usually less risky than a share, but often pays less. The main risk: the borrower cannot pay you back."],ex:"West African states such as Côte d'Ivoire and Senegal regularly borrow on the regional market by issuing bonds. Some are listed on the BRVM.",q:[["You buy a government bond. You are…",["Owner of part of the country","A lender to the government","A shareholder in the central bank"],1,"A bond is a loan: the government pays you interest and repays you at maturity."],["What is the main risk of a bond?",["The borrower fails to repay","The share price rises too fast","There is no dividend"],0,"The core risk of any loan is default: the borrower can no longer pay."]]}},
{id:"inflation",fr:{t:"L'inflation",s:"Pourquoi l'argent qui dort perd de la valeur",p:["L'inflation, c'est la hausse générale des prix. Quand elle est de 10 % sur un an, ce qui coûtait 1 000 coûte 1 100 un an plus tard.","Résultat : l'argent gardé sous le matelas achète de moins en moins de choses, même si le nombre de billets ne change pas.","Pour protéger son épargne, il faut qu'elle rapporte au moins autant que l'inflation. C'est l'une des premières raisons d'investir."],ex:"Là où l'inflation est forte, beaucoup de familles achètent des biens durables — un terrain, du bétail, des matériaux de construction — plutôt que de garder des billets. C'est une manière de se protéger de la hausse des prix.",q:[["L'inflation est de 10 % cette année. Vos 100 000 sont restés sous le matelas. Dans un an…",["Ils achètent plus de choses","Ils achètent autant de choses","Ils achètent moins de choses"],2,"Les prix ont monté de 10 % : vos 100 000 n'achètent plus que l'équivalent d'environ 90 900 d'aujourd'hui."],["Pour ne pas perdre de pouvoir d'achat, votre épargne doit rapporter…",["Au moins autant que l'inflation","Moins que l'inflation","Rien du tout, c'est plus sûr"],0,"Si votre épargne rapporte moins que l'inflation, elle perd de la valeur chaque année, même sans perte visible."]]},
en:{t:"Inflation",s:"Why idle money loses value",p:["Inflation is a general rise in prices. At 10% a year, what cost 1,000 costs 1,100 a year later.","So money kept under the mattress buys less and less, even though the number of notes stays the same.","To protect your savings, they need to earn at least as much as inflation. That is one of the first reasons to invest."],ex:"Where inflation is high, many families buy lasting assets — land, livestock, building materials — rather than holding cash. It is a way to shield themselves from rising prices.",q:[["Inflation is 10% this year. Your 100,000 stayed under the mattress. In a year…",["It buys more","It buys the same","It buys less"],2,"Prices rose 10%: your 100,000 now buys only what about 90,900 buys today."],["To keep your purchasing power, your savings must earn…",["At least as much as inflation","Less than inflation","Nothing at all, it's safer"],0,"If your savings earn less than inflation, they lose value every year, even with no visible loss."]]}},
{id:"composes",fr:{t:"Les intérêts composés",s:"Quand l'argent fait des petits",p:["La tontine est une excellente façon d'épargner ensemble. Mais l'argent n'y grossit pas : on récupère ce qu'on a mis.","Avec un placement qui rapporte des intérêts, les intérêts de l'an 1 rapportent eux-mêmes des intérêts l'an 2, et ainsi de suite. C'est l'effet boule de neige des intérêts composés.","Le secret, c'est le temps : plus on commence tôt, plus la boule de neige grossit."],ex:"100 000 FCFA placés à 8 % par an pendant 10 ans deviennent environ 215 900 FCFA. Sans réinvestir les intérêts (8 000 par an mis de côté), on n'aurait que 180 000 FCFA.",q:[["Vous placez 1 000 à 10 % par an, intérêts réinvestis. Combien avez-vous après 2 ans ?",["1 200","1 210","1 100"],1,"An 1 : 1 000 + 100 = 1 100. An 2 : 1 100 + 110 = 1 210. Les 10 de plus, ce sont les intérêts sur les intérêts."],["Quel est le meilleur allié des intérêts composés ?",["Le temps","La chance","Retirer ses gains chaque année"],0,"Plus l'argent reste placé longtemps, plus l'effet boule de neige est fort. Retirer ses gains l'arrête."]]},
en:{t:"Compound interest",s:"When money grows on money",p:["A tontine is a great way to save together. But the money doesn't grow: you get back what you put in.","With an investment that pays interest, year 1's interest earns its own interest in year 2, and so on. That's the snowball effect of compound interest.","The secret is time: the earlier you start, the bigger the snowball."],ex:"100,000 CFA francs invested at 8% a year for 10 years become about 215,900 CFA. Without reinvesting the interest (8,000 a year set aside), you would have only 180,000 CFA.",q:[["You invest 1,000 at 10% a year, interest reinvested. How much after 2 years?",["1,200","1,210","1,100"],1,"Year 1: 1,000 + 100 = 1,100. Year 2: 1,100 + 110 = 1,210. The extra 10 is interest on interest."],["What is compound interest's best friend?",["Time","Luck","Taking your gains out every year"],0,"The longer money stays invested, the stronger the snowball. Taking gains out stops it."]]}},
{id:"diversifier",fr:{t:"Diversifier",s:"Ne pas mettre tous ses œufs dans le même panier",p:["Diversifier, c'est répartir son argent entre plusieurs entreprises, plusieurs secteurs, voire plusieurs pays.","Si une entreprise va mal, les autres peuvent compenser. On réduit le risque de tout perdre d'un coup.","La diversification ne supprime pas le risque, mais elle évite qu'une seule mauvaise nouvelle ruine toute votre épargne."],ex:"Une commerçante de Kinshasa qui vend du riz, de l'huile et du savon souffre moins si le prix du riz s'effondre qu'une autre qui ne vend que du riz. En Bourse, c'est le même principe.",q:[["Aïcha a 500 000 à investir. Quelle option est la plus diversifiée ?",["Tout dans une seule entreprise de télécoms","Un peu dans une banque, une entreprise agricole et une entreprise d'énergie","Tout dans deux opérateurs télécoms"],1,"Trois secteurs différents : si l'un traverse une crise, les deux autres peuvent tenir."],["La diversification permet…",["De supprimer tout risque","De réduire le risque de tout perdre d'un coup","De garantir un gain"],1,"Aucun placement n'est sans risque. Diversifier réduit l'impact d'un mauvais choix, sans rien garantir."]]},
en:{t:"Diversify",s:"Don't put all your eggs in one basket",p:["Diversifying means spreading your money across several companies, several sectors, even several countries.","If one company does badly, the others can make up for it. You lower the risk of losing everything at once.","Diversification doesn't remove risk, but it stops a single piece of bad news from wiping out all your savings."],ex:"A Kinshasa trader who sells rice, oil and soap suffers less when the price of rice collapses than one who sells only rice. On the stock market, the principle is the same.",q:[["Aïcha has 500,000 to invest. Which option is the most diversified?",["All in one telecoms company","Some in a bank, a farming company and an energy company","All in two telecoms operators"],1,"Three different sectors: if one hits a crisis, the other two can hold up."],["Diversification lets you…",["Remove all risk","Lower the risk of losing everything at once","Guarantee a gain"],1,"No investment is risk-free. Diversifying reduces the impact of one bad choice, without guaranteeing anything."]]}},
{id:"levee",fr:{t:"La levée de fonds",s:"Comment les startups trouvent de l'argent",p:["Une startup qui veut grandir vite a besoin d'argent avant d'être rentable. Elle vend alors une partie de son capital à des investisseurs : c'est une levée de fonds.","On parle d'amorçage pour les premiers tours, souvent modestes, puis de série A, série B… quand les montants grossissent.","Les fondateurs possèdent une part de plus en plus petite de l'entreprise : c'est la dilution. En échange, l'entreprise a les moyens de grandir."],ex:"En octobre 2026, East Africa Foods (Tanzanie) a levé 40 millions de dollars auprès d'InfraCo Africa, Oikocredit et FMO pour acheter, stocker et transformer les récoltes des petits fermiers.",q:[["Lors d'une levée de fonds, la startup donne aux investisseurs…",["Une partie de son capital","Un prêt à rembourser en un an","Rien, c'est un don"],0,"Les investisseurs deviennent copropriétaires : ils parient sur la croissance future de l'entreprise."],["Après plusieurs levées, la part des fondateurs…",["Augmente","Diminue : c'est la dilution","Reste toujours la même"],1,"À chaque tour, de nouvelles parts sont créées pour les investisseurs, donc la part des fondateurs diminue."]]},
en:{t:"Fundraising",s:"How startups find money",p:["A startup that wants to grow fast needs money before it turns a profit. So it sells part of its capital to investors: that's a funding round.","Early rounds, often modest, are called seed; then come Series A, Series B… as amounts grow.","Founders end up owning a smaller and smaller share of the company: that's dilution. In return, the company gets the means to grow."],ex:"In October 2026, East Africa Foods (Tanzania) raised $40 million from InfraCo Africa, Oikocredit and FMO to buy, store and process smallholder farmers' harvests.",q:[["In a funding round, the startup gives investors…",["Part of its capital","A loan to repay within a year","Nothing, it's a gift"],0,"Investors become co-owners: they are betting on the company's future growth."],["After several rounds, the founders' share…",["Grows","Shrinks: that's dilution","Always stays the same"],1,"Each round creates new shares for investors, so the founders' share shrinks."]]}},
{id:"brvm",fr:{t:"La BRVM",s:"La Bourse commune de l'Afrique de l'Ouest",p:["La BRVM, Bourse régionale des valeurs mobilières, est installée à Abidjan. Elle est commune à 8 pays : Bénin, Burkina Faso, Côte d'Ivoire, Guinée-Bissau, Mali, Niger, Sénégal et Togo.","On y achète et vend des actions et des obligations, en francs CFA, par l'intermédiaire d'une SGI, une société de gestion et d'intermédiation agréée.","Un atout : le franc CFA d'Afrique de l'Ouest est lié à l'euro par un taux fixe, ce qui limite le risque de change pour qui raisonne en euros."],ex:"Au 4 septembre 2026, l'indice BRVM Composite avait gagné 58,7 % depuis le 1er janvier. Mais une Bourse peut aussi baisser : les gains passés ne garantissent rien.",q:[["Combien de pays partagent la BRVM ?",["3","8","15"],1,"Les 8 pays de l'UEMOA : Bénin, Burkina Faso, Côte d'Ivoire, Guinée-Bissau, Mali, Niger, Sénégal et Togo."],["Combien de francs CFA vaut 1 euro, au taux fixe ?",["100 FCFA","655,957 FCFA","1 000 FCFA"],1,"Le taux est fixe depuis 1999 : 1 € = 655,957 FCFA."]]},
en:{t:"The BRVM",s:"West Africa's shared stock exchange",p:["The BRVM, West Africa's regional stock exchange, is based in Abidjan. It is shared by 8 countries: Benin, Burkina Faso, Côte d'Ivoire, Guinea-Bissau, Mali, Niger, Senegal and Togo.","Shares and bonds are bought and sold there in CFA francs, through an SGI, a licensed brokerage firm.","An edge: the West African CFA franc is pegged to the euro at a fixed rate, which limits currency risk for anyone who thinks in euros."],ex:"As of 4 September 2026, the BRVM Composite index was up 58.7% since 1 January. But markets can fall too: past gains guarantee nothing.",q:[["How many countries share the BRVM?",["3","8","15"],1,"The 8 WAEMU countries: Benin, Burkina Faso, Côte d'Ivoire, Guinea-Bissau, Mali, Niger, Senegal and Togo."],["How many CFA francs is €1 worth at the fixed rate?",["100 CFA","655.957 CFA","1,000 CFA"],1,"The rate has been fixed since 1999: €1 = 655.957 CFA francs."]]}}
];
const LV=[0,40,90,140];
const xp=()=>Object.values(S.done||{}).reduce((a,b)=>a+b,0)*10;
const lvl=()=>LV.filter(v=>xp()>=v).length-1;
let L=null;
function ecole(){const x=xp(),li=lvl(),nx=LV[li+1],lv=t("lvls");
 const pct=nx?Math.round((x-LV[li])/(nx-LV[li])*100):100;
 return `<header class="mast" style="border-bottom:1px solid var(--ink)"><h1>${t("eduT")}</h1><svg width="36" height="36" aria-hidden="true"><use href="#cowry"/></svg></header>
<p style="margin:14px 0 0;font-size:15px">${t("eduS")}</p>
<div class="hero" style="margin:16px 0;padding:16px 0"><p class="kick" style="margin:0 0 4px">${t("lvl")}</p>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="big2" style="font-size:clamp(26px,7vw,34px);white-space:normal">${lv[li]}</span><span style="display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap"><svg width="20" height="20" aria-hidden="true"><use href="#cowry"/></svg>${x} ${t("cauris")}</span></div>
<div class="prog"><i style="width:${pct}%"></i></div>
<p class="meta" style="margin:0">${nx?t("nextLvl").replace("{n}",nx-x).replace("{l}",lv[li+1]):t("maxLvl")}</p></div>
<p class="kick">${t("lessons")}</p>
${LES.map((l,i)=>{const d=S.done[l.id],n=l[S.lang].q.length;return `<button class="les" data-les="${l.id}"><span class="k">${i+1}</span><span><b class="serif" style="font-size:17px;display:block">${l[S.lang].t}</b><span class="meta">${l[S.lang].s}</span></span><span class="st ${d==n?"ok":""}">${d==null?t("min3"):d+"/"+n}</span></button>`}).join("")}
<div class="disc">${t("eduD")}</div>`}
function lecon(){if(!L)return ecole();const l=LES.find(x=>x.id==L.id),c=l[S.lang],n=c.q.length,idx=LES.indexOf(l);
 const top=`<div class="top"><button class="back" data-go="ecole">${t("backE")}</button><span class="meta">${t("lesN")} ${idx+1}/${LES.length}</span></div>`;
 if(L.ph=="read")return top+`<p class="kick">${t("eduT")}</p><h2 class="head">${c.t}</h2><p class="dek">${c.s}</p><p class="meta">${t("min3")} · ${n} ${t("qs")}</p>
<div class="body" style="margin-top:14px">${c.p.map((p,i)=>`<p class="${i==0?"drop":""}">${p}</p>`).join("")}</div>
<div class="ex"><p class="kick" style="margin:0 0 4px">${t("exK")}</p>${c.ex}</div>
<button class="btn solid" data-ph="quiz">${t("toQuiz")}</button>`;
 if(L.ph=="quiz"){const q=c.q[L.i],on=L.pk!=null,ok=L.pk==q[2];return top+`<p class="kick">${t("qOf")} ${L.i+1}/${n}</p><div class="prog"><i style="width:${(L.i+(on?1:0))/n*100}%"></i></div>
<h2 class="head" style="font-size:clamp(22px,6vw,28px);margin-top:14px">${q[0]}</h2>
${q[1].map((o,j)=>`<button class="opt ${on&&j==q[2]?"ok":on&&j==L.pk?"no":""}" data-opt="${j}" ${on?"disabled":""}>${o}</button>`).join("")}
${on?`<div class="fb" role="status"><b style="color:${ok?"var(--green)":"var(--red)"}">${ok?t("good"):t("bad")}</b>${q[3]}</div><button class="btn solid" data-nx="1">${L.i<n-1?t("nxt"):t("seeRes")}</button>`:""}`}
 const nl=LES[idx+1];
 return top+`<div class="hero" style="text-align:center"><svg width="56" height="56" aria-hidden="true"><use href="#cowry"/></svg><h2 class="head" style="margin:8px 0">${t("finT")}</h2><p class="dek">${t("finS").replace("{g}",L.g).replace("{n}",n)}</p>
${L.earn?`<p class="big2" style="color:var(--red);margin:14px 0 0">+${L.earn} ${t("cauris")}</p>`:`<p class="meta" style="margin:12px 0 0">${t("noNew")}</p>`}</div>
${nl?`<button class="btn solid" data-les="${nl.id}">${t("nextLes")} : ${nl[S.lang].t}</button>`:""}
<button class="btn" data-retry="1">${t("retry")}</button><button class="btn" data-go="ecole">${t("backE")}</button>`}
const VIEWS={investir,une,article,ecole,lecon,entreprises:ent,alertes:alr,compte:acc};
const TABMAP=[["une","une"],["ecole","edu"],["entreprises","ent"],["alertes","alr"],["compte","acc"]];
function render(){
 document.documentElement.lang=S.lang;
 if(!S.onb){$("view").innerHTML=onbView();$("tabs").parentElement.style.display="none";return}
 $("tabs").parentElement.style.display="";
 let v=(location.hash||"#une").slice(1);if(!VIEWS[v])v="une";
 $("view").innerHTML=VIEWS[v]();
 const cur=v=="lecon"?"ecole":(v=="article"||v=="investir")?"une":v;
 $("tabs").innerHTML=TABMAP.map(([h,k])=>`<button class="tab ${cur==h?"on":""}" data-go="${h}" ${cur==h?'aria-current="page"':""}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${icons[k]}</svg>${t(k)}</button>`).join("");
}
function go(h){if(location.hash=="#"+h)render();else location.hash=h;window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{stopAudio();render();window.scrollTo(0,0)});

let speaking=false;
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}speaking=false}
function toggleAudio(){
 if(!("speechSynthesis" in window)){toast(t("noAudio"));return}
 if(speaking){stopAudio();$("playL").textContent=t("listen");return}
 try{
  const txt=[t("title"),t("dek"),t("motT"),"46 %. "+t("numT"),t("loupeT")+". "+t("loupeD"),POULS[S.lang].join(" ").replace(/<[^>]+>/g,""),t("retenirT")].join(". ");
  const u=new SpeechSynthesisUtterance(txt);u.lang=S.lang=="fr"?"fr-FR":"en-GB";u.rate=1;
  u.onend=()=>{speaking=false;const l=$("playL");if(l)l.textContent=t("listen")};
  speechSynthesis.speak(u);speaking=true;$("playL").textContent=t("stop");
 }catch(e){toast(t("noAudio"))}
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button,[data-go]");if(!b)return;
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.les){L={id:b.dataset.les,ph:"read",i:0,pk:null,g:0,earn:0};go("lecon");return}
 if(b.dataset.ph&&L){L.ph="quiz";render();window.scrollTo(0,0);return}
 if(b.dataset.opt&&L){if(L.pk!=null)return;L.pk=+b.dataset.opt;if(L.pk==LES.find(x=>x.id==L.id)[S.lang].q[L.i][2])L.g++;render();return}
 if(b.dataset.nx&&L){const n=LES.find(x=>x.id==L.id)[S.lang].q.length;if(L.i<n-1){L.i++;L.pk=null}else{const o=S.done[L.id]||0;L.earn=Math.max(0,L.g-o)*10;if(S.done[L.id]==null||L.g>o)S.done[L.id]=Math.max(L.g,o);L.ph="end";save()}render();window.scrollTo(0,0);return}
 if(b.dataset.retry&&L){L={id:L.id,ph:"quiz",i:0,pk:null,g:0,earn:0};render();window.scrollTo(0,0);return}
 if(b.dataset.step){const n=+b.dataset.step;if(n==3&&!S.c.length){errMsg=t("errInt");render();return}errMsg="";step=n;render();window.scrollTo(0,0);return}
 if(b.id=="whyToggle"){whyAll=!whyAll;render();return}
 if(b.id=="finish"){S.onb=true;save();location.hash="une";render();window.scrollTo(0,0);return}
 if(b.id=="logout"){stopAudio();S.onb=false;step=0;save();render();window.scrollTo(0,0);return}
 if(b.id=="play"){toggleAudio();return}
 if(b.dataset.load){S.loaded[b.dataset.load]=1;render();return}
 if(b.dataset.filt){S.filt=b.dataset.filt;render();return}
 if(b.dataset.lang){stopAudio();S.lang=b.dataset.lang;save();render();return}
 if(b.dataset.sw){S[b.dataset.sw]=!S[b.dataset.sw];if(b.dataset.sw=="eco")S.loaded={};save();b.setAttribute("aria-checked",S[b.dataset.sw]);return}
 if(b.dataset.c){const c=b.dataset.c;S.c=S.c.includes(c)?S.c.filter(x=>x!=c):[...S.c,c];save();b.setAttribute("aria-pressed",S.c.includes(c));return}
 if(b.dataset.s){const i=+b.dataset.s;S.s=S.s.includes(i)?S.s.filter(x=>x!=i):[...S.s,i];save();b.setAttribute("aria-pressed",S.s.includes(i));return}
 if(b.id=="notifyEnt"){toast(t("done"));return}
});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.go)go(e.target.dataset.go)});
document.addEventListener("change",e=>{if(e.target.id=="day"){S.day=+e.target.value;save()}});
render();
}
</script>
</body>
</html>
